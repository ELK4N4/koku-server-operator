# CostManagementServiceConfig for the operator pytest harness (COST-7697).
# Applied by scripts/install-cmsc.sh (via deploy-test.sh). Script may patch kafka/auth/S3 endpoints
# after deploying prerequisites.
apiVersion: service.costmanagement.openshift.io/v1alpha1
kind: CostManagementServiceConfig
metadata:
  name: cost-management
  namespace: cost-onprem
spec:
  global:
    clusterDomain: ""
    storageClass: ""

  database:
    deploy: true
    image:
      repository: registry.redhat.io/rhel10/postgresql-16
      tag: "10.1"
    storage:
      size: 30Gi

  cache:
    deploy: true
    image:
      repository: registry.redhat.io/rhel10/valkey-8
      tag: "10.1"
    persistence:
      size: 5Gi

  kafka:
    # Patched by install-cmsc.sh when Kafka is installed
    bootstrapServers: "cost-onprem-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"

  ingress:
    image:
      repository: quay.io/iop/ingress
      tag: "master"

  objectStorage:
    # Patched / discovered by install-cmsc.sh when possible
    endpoint: "s3.openshift-storage.svc.cluster.local"
    port: 443
    useSSL: true

  costManagement:
    api:
      image:
        repository: quay.io/redhat-services-prod/cost-mgmt-dev-tenant/koku
        tag: "d8055ac"
      replicas: 1
    masu:
      image:
        repository: quay.io/redhat-services-prod/cost-mgmt-dev-tenant/koku
        tag: "d8055ac"
      replicas: 1
    listener:
      replicas: 1
    celery:
      workers:
        default:
          replicas: 1
        priority:
          replicas: 1
        summary:
          replicas: 1
        ocp:
          replicas: 1
        costModel:
          replicas: 1

  ros:
    enabled: true
    image:
      repository: quay.io/redhat-services-prod/insights-management-tenant/insights-ocp-resource-optimization/ros-ocp-backend
      tag: "ae8c990"
    processor:
      replicas: 1

  rbac:
    image:
      repository: quay.io/redhat-services-prod/hcc-accessmanagement-tenant/insights-rbac
      tag: "73870d8"
    api:
      replicas: 1
    worker:
      replicas: 1

  kruize:
    replicas: 1
    image:
      repository: quay.io/redhat-services-prod/kruize-autotune-tenant/autotune
      tag: "d1f0140"

  auth:
    envoy:
      image:
        repository: registry.redhat.io/openshift-service-mesh/proxyv2-rhel9
        tag: "2.6"
      replicas: 1
    keycloak:
      # Patched by install-cmsc.sh from live RHBK Service ports (8080 vs 8443).
      url: "https://keycloak.keycloak.svc.cluster.local:8443"
      realm: kubernetes
      audiences:
        - "cost-management-operator"
        - "cost-management-ui"
      tls:
        insecureSkipVerify: true

  ui:
    replicaCount: 1
    oauthProxy:
      image:
        repository: registry.access.redhat.com/rhceph/oauth2-proxy-rhel9
        tag: "v7.6.0"
    app:
      image:
        repository: quay.io/insights-onprem/koku-ui-onprem
        tag: "2f23c646581028bd385856b6713e6bf367baf953"

  monitoring:
    enabled: true
