# Canonical for pytest; chart values.yaml is also accepted when cloned adjacently.
jwtAuth:
  realmUsers:
    - username: admin
      password: admin
      email: admin@test.com
      firstName: Admin
      lastName: User
      orgId: "org1234567"
      accountNumber: "7890123"
      orgAdmin: true
    - username: viewer
      password: viewer
      email: viewer@test.com
      firstName: Viewer
      lastName: User
      orgId: "org1234567"
      accountNumber: "7890123"
      orgAdmin: false
