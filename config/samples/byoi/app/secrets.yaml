# App-namespace Secrets matching CRD key names. Values must match
# ../infra/credentials.yaml. Apply BEFORE the CostManagementServiceConfig so
# the operator does not generate random credentials first.
apiVersion: v1
kind: Namespace
metadata:
  name: cost-byoi
  labels:
    app.kubernetes.io/part-of: koku-server-operator-byoi
    app.kubernetes.io/component: app
---
apiVersion: v1
kind: Secret
metadata:
  name: byoi-db-credentials
  namespace: cost-byoi
  labels:
    app.kubernetes.io/part-of: koku-server-operator-byoi
type: Opaque
stringData:
  postgres-user: postgres
  postgres-password: byoi-postgres-password
  koku-user: koku_user
  koku-password: byoi-koku-password
  ros-user: ros_user
  ros-password: byoi-ros-password
  kruize-user: kruize_user
  kruize-password: byoi-kruize-password
  rbac-user: rbac_user
  rbac-password: byoi-rbac-password
---
apiVersion: v1
kind: Secret
metadata:
  name: byoi-cache-credentials
  namespace: cost-byoi
  labels:
    app.kubernetes.io/part-of: koku-server-operator-byoi
type: Opaque
stringData:
  redis-password: byoi-valkey-password
---
apiVersion: v1
kind: Secret
metadata:
  name: byoi-s3-credentials
  namespace: cost-byoi
  labels:
    app.kubernetes.io/part-of: koku-server-operator-byoi
type: Opaque
stringData:
  access-key: byoi-minio-access
  secret-key: byoi-minio-secret-key
