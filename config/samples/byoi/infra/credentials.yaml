# Fixed test credentials for infra pods. Mirrored (with CRD key names) into
# cost-byoi via ../app/secrets.yaml. NOT for production.
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-credentials
  namespace: cost-byoi-infra
  labels:
    app.kubernetes.io/part-of: koku-service-operator-byoi
    app.kubernetes.io/component: postgresql
type: Opaque
stringData:
  postgres-user: postgres
  postgres-password: byoi-postgres-password
  koku-user: koku_user
  koku-password: byoi-koku-password
  ros-user: ros_user
  ros-password: byoi-ros-password
  kruize-user: kruize_user
  kruize-password: byoi-kruize-password
  rbac-user: rbac_user
  rbac-password: byoi-rbac-password
---
apiVersion: v1
kind: Secret
metadata:
  name: valkey-credentials
  namespace: cost-byoi-infra
  labels:
    app.kubernetes.io/part-of: koku-service-operator-byoi
    app.kubernetes.io/component: valkey
type: Opaque
stringData:
  redis-password: byoi-valkey-password
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: cost-byoi-infra
  labels:
    app.kubernetes.io/part-of: koku-service-operator-byoi
    app.kubernetes.io/component: minio
type: Opaque
stringData:
  access-key: byoi-minio-access
  secret-key: byoi-minio-secret-key
