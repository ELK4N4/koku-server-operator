apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: valkey-data
  namespace: cost-byoi-infra
  labels:
    app.kubernetes.io/part-of: koku-service-operator-byoi
    app.kubernetes.io/component: valkey
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: cost-byoi-infra
  labels:
    app.kubernetes.io/part-of: koku-service-operator-byoi
    app.kubernetes.io/component: valkey
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    app.kubernetes.io/name: valkey
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: cost-byoi-infra
  labels:
    app.kubernetes.io/part-of: koku-service-operator-byoi
    app.kubernetes.io/component: valkey
    app.kubernetes.io/name: valkey
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: koku-service-operator-byoi
        app.kubernetes.io/component: valkey
        app.kubernetes.io/name: valkey
    spec:
      serviceAccountName: byoi-infra
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:8
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - exec valkey-server --requirepass "$REDIS_PASSWORD" --save "" --appendonly no
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-credentials
                  key: redis-password
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'valkey-cli -a "$REDIS_PASSWORD" ping | grep -q PONG'
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'valkey-cli -a "$REDIS_PASSWORD" ping | grep -q PONG'
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: valkey-data
