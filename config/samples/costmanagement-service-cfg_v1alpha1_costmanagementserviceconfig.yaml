apiVersion: costmanagement-service-cfg.openshift.io/v1alpha1
kind: CostManagementServiceConfig
metadata:
  name: cost-management
  namespace: cost-onprem
spec:
  global:
    clusterDomain: "apps.cluster.local"
    storageClass: ""  # empty = use cluster default; set to ocs-storagecluster-ceph-rbd on ODF clusters

  database:
    deploy: true
    image:
      repository: registry.redhat.io/rhel10/postgresql-16
      tag: "10.1"
    storage:
      size: 30Gi

  cache:
    deploy: true
    image:
      repository: registry.redhat.io/rhel10/valkey-8
      tag: "10.1"
    persistence:
      size: 5Gi

  kafka:
    bootstrapServers: "cost-onprem-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"

  objectStorage:
    endpoint: "s3.openshift-storage.svc.cluster.local"
    port: 443
    useSSL: true

  costManagement:
    api:
      image:
        repository: quay.io/martin_povolny/koku
        tag: "latest"
      replicas: 1
    masu:
      image:
        repository: quay.io/martin_povolny/koku
        tag: "latest"
      replicas: 1
    listener:
      replicas: 2
    celery:
      workers:
        default:
          replicas: 1
        priority:
          replicas: 1
        summary:
          replicas: 2
        ocp:
          replicas: 2
        costModel:
          replicas: 1

  ros:
    image:
      repository: quay.io/redhat-services-prod/insights-management-tenant/insights-ocp-resource-optimization/ros-ocp-backend
      tag: "ae8c990"
    processor:
      replicas: 1

  rbac:
    image:
      repository: quay.io/redhat-services-prod/hcc-accessmanagement-tenant/insights-rbac
      tag: "73870d8"
    api:
      replicas: 1
    worker:
      replicas: 1

  kruize:
    replicas: 1
    image:
      repository: quay.io/redhat-services-prod/kruize-autotune-tenant/autotune
      tag: "d1f0140"

  auth:
    envoy:
      image:
        repository: registry.redhat.io/openshift-service-mesh/proxyv2-rhel9
        tag: "2.6"
      replicas: 2
    keycloak:
      realm: kubernetes

  ui:
    replicaCount: 1
    app:
      image:
        repository: quay.io/insights-onprem/koku-ui-onprem
        tag: "2f23c646581028bd385856b6713e6bf367baf953"

  monitoring:
    enabled: true
