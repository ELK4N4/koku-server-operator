# This rule is not used by the project koku-service-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over service.costmanagement.openshift.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: koku-service-operator
    app.kubernetes.io/managed-by: kustomize
  name: costmanagementserviceconfig-admin-role
rules:
- apiGroups:
  - service.costmanagement.openshift.io
  resources:
  - costmanagementserviceconfigs
  verbs:
  - '*'
- apiGroups:
  - service.costmanagement.openshift.io
  resources:
  - costmanagementserviceconfigs/status
  verbs:
  - get
