# This rule is not used by the project koku-server-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to cost.redhat.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: koku-server-operator
    app.kubernetes.io/managed-by: kustomize
  name: costmanagement-viewer-role
rules:
- apiGroups:
  - cost.redhat.com
  resources:
  - costmanagements
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cost.redhat.com
  resources:
  - costmanagements/status
  verbs:
  - get
