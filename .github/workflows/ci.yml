name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # All known standard library vulnerabilities in go1.25.0.
          # go mod tidy bumped go.mod from 1.24→1.25 when upgrading x/text and
          # x/net to fix third-party CVEs; go1.25.0 itself has many stdlib vulns.
          # TODO: remove suppressions after upgrading go.mod to go1.25.12+
          SUPPRESSED="
            GO-2025-4007 GO-2025-4008 GO-2025-4009 GO-2025-4010 GO-2025-4011
            GO-2025-4012 GO-2025-4013 GO-2025-4155 GO-2025-4175
            GO-2026-4337 GO-2026-4340 GO-2026-4341
            GO-2026-4601 GO-2026-4602
            GO-2026-4865 GO-2026-4870 GO-2026-4918
            GO-2026-4946 GO-2026-4947 GO-2026-4971
            GO-2026-5037 GO-2026-5038 GO-2026-5039 GO-2026-5856
          "
          set +e
          output=$(govulncheck ./... 2>&1)
          rc=$?
          echo "$output"
          if [ $rc -eq 0 ]; then
            exit 0
          fi
          # Extract every GO-XXXX-YYYY ID that govulncheck reported, then
          # remove the suppressed ones. Anything left is an unsuppressed finding.
          found=$(echo "$output" | grep -oE 'GO-[0-9]+-[0-9]+' | sort -u)
          unsuppressed=""
          for id in $found; do
            if ! echo "$SUPPRESSED" | grep -qw "$id"; then
              unsuppressed="$unsuppressed $id"
            fi
          done
          if [ -z "$unsuppressed" ]; then
            echo "::notice::govulncheck findings suppressed: $SUPPRESSED (go1.25.0 stdlib vulns, fixed in go1.25.11+)"
            exit 0
          fi
          echo "::error::Unsuppressed vulnerabilities:$unsuppressed"
          exit 1

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build manager
        run: go build -o /dev/null ./cmd/main.go

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Cache envtest binaries
        uses: actions/cache@v4
        with:
          path: bin/k8s
          key: envtest-${{ runner.os }}-${{ hashFiles('go.mod') }}

      - name: Run tests (unit + envtest integration)
        run: make test

      - name: Coverage summary
        run: |
          echo '### Test Coverage' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=cover.out | grep -E 'total:|\.go:' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  check-generated:
    name: Check Generated Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install controller-gen
        run: |
          GOBIN=$(pwd)/bin go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.18.0

      - name: Regenerate deep-copy and CRD manifests
        run: |
          bin/controller-gen object:headerFile="hack/boilerplate.go.txt" paths="./..."
          bin/controller-gen rbac:roleName=manager-role crd paths="./..." \
            output:crd:artifacts:config=config/crd/bases \
            output:rbac:artifacts:config=config/rbac

      - name: Fail if generated files are stale
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated files are out of date. Run 'make generate manifests' locally and commit."
            git diff --stat
            exit 1
          fi

  links:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            'docs/**/*.md'
            'README.md'
            'CLAUDE.md'
          fail: true

  container-build:
    name: Container Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: koku-server-operator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
